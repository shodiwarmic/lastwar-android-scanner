name: Build APK

# Builds the debug APK on every push to main (and on PRs into main so the build
# is validated before it merges). The APK is uploaded as a downloadable artifact.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # The screen_definitions assets live in a separate (public) submodule
          # repo and are packaged into the APK, so they must be checked out.
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 9.x requires JDK 17+; 21 matches Android Studio's bundled JBR.
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK platform
        # compileSdk = 36 (app/build.gradle.kts). Build-tools are resolved by AGP.
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
